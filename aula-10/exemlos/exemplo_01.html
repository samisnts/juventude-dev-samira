<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <form action="submit" id="formulario">
    <label for="nome">digite seu nome</label><br>
    <input type="text" id="nome"><br><br>

<label for="email">digite seu email</label><br>
<input type="email" id="email" name="email" required><br><br>

    <label for="idade">digite sua idade</label><br>
    <input type="text" id="idade" name="idade" required><br><br>

    <label for="data de nascimento">Data de nascimento</label>
    <input type="date" id="data de nascimento" name="data de nascimento">
    <input type="submit" value="enviar">
   </form>
   <script>
    const form = document.querySelector("#formulario")
    form.addEventListener("submit",
    function(event){
        event.preventDefault()
        const nome = document.querySelector("#nome").value
        alert("formulario preenchido com sucesso!" + nome)
    }
)
   </script> 
</body>
</html>
